<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Featured cards from the OrangeFrenzy21Cards personal soccer card collection."
    />
    <title>Gallery | OrangeFrenzy21Cards</title>
    <link rel="icon" href="../images/orangefrenzy21-logo.png" />
    <link rel="stylesheet" href="../style.css?v=mobile-fix-1" />
  </head>
  <body class="gallery-page">
    <header class="catalog-header">
      <a class="catalog-brand" href="../index.html" aria-label="OrangeFrenzy21Cards home">
        <img
          class="catalog-logo"
          src="../images/orangefrenzy21-logo.png"
          alt="OrangeFrenzy21 Sports Card"
        />
      </a>

      <nav class="catalog-nav" aria-label="Primary navigation">
        <a href="../index.html">Home</a>
        <a class="active" href="gallery.html">Gallery</a>
        <a href="collection.html">Collection</a>
        <a href="statistics.html">Statistics</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="catalog-main">
      <section class="gallery-section gallery-top" aria-labelledby="top-three-title">
        <div class="gallery-section-heading">
          <p class="eyebrow">Collection Favorites</p>
          <h2 id="top-three-title">Top 3 Cards</h2>
        </div>
        <div class="gallery-grid gallery-top-grid" id="galleryTopGrid"></div>
      </section>

      <section class="gallery-section gallery-milestones" aria-label="Collection milestones">
        <div class="gallery-milestone">
          <div class="gallery-section-heading">
            <p class="eyebrow">Where It Started</p>
            <h2>First Numbered + Autograph Card</h2>
          </div>
          <div class="gallery-grid gallery-milestone-grid" id="galleryFirstGrid"></div>
        </div>

        <div class="gallery-milestone">
          <div class="gallery-section-heading">
            <p class="eyebrow">Where It Started</p>
            <h2>First Marco Reus Card</h2>
          </div>
          <div class="gallery-grid gallery-milestone-grid" id="galleryFirstReusGrid"></div>
        </div>
      </section>
    </main>

    <footer class="catalog-footer">
      <p class="catalog-footer-copyright">
        &copy; 2026 OrangeFrenzy21Cards. All rights reserved.
      </p>
      <div class="footer-identity">
        <p>Clubs &amp; Countries</p>
        <div class="footer-crests">
          <a
            href="https://www.bvb.de/de/en.html"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Borussia Dortmund official website"
          >
            <img src="../images/footer-logos/borussia-dortmund.svg" alt="" />
          </a>
          <a
            href="https://www.whufc.com/en"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="West Ham United official website"
          >
            <img src="../images/footer-logos/west-ham.svg" alt="" />
          </a>
          <a
            href="https://www.knvb.com/oranje/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Netherlands national football team official website"
          >
            <img src="../images/footer-logos/netherlands.svg" alt="" />
          </a>
        </div>
      </div>
      <div class="footer-socials" aria-label="OrangeFrenzy21Cards social links">
        <a
          href="https://www.instagram.com/orangefrenzy21_cards?igsh=b2NrM25yZDZ5bTI0&amp;utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="OrangeFrenzy21Cards on Instagram"
        >
          <img src="../images/footer-logos/instagram.png" alt="" />
        </a>
        <a
          href="https://www.ebay.ca/usr/orangefrenzy21_cards"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="OrangeFrenzy21Cards on eBay"
        >
          <img src="../images/footer-logos/ebay.svg" alt="" />
        </a>
      </div>
    </footer>

    <dialog class="card-dialog" id="cardDialog" aria-labelledby="dialogTitle">
      <button class="dialog-close" id="dialogClose" type="button" aria-label="Close">
        &times;
      </button>
      <div class="dialog-content" id="dialogContent"></div>
    </dialog>

    <template id="cardTemplate">
      <article class="card-item">
        <button class="card-open" type="button">
          <span class="card-image-wrap">
            <img class="card-image" alt="" loading="lazy" />
          </span>
          <span class="card-info">
            <span class="card-set"></span>
            <strong class="card-title"></strong>
            <span class="card-details"></span>
          </span>
        </button>
      </article>
    </template>

    <script src="../script.js?v=mobile-fix-1"></script>
  </body>
</html>
